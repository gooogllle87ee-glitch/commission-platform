<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>委託平台</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Noto Sans TC", sans-serif;
      background: #f6f6f6;
      color: #222;
    }

    header {
      height: 64px;
      background: white;
      border-bottom: 1px solid #ddd;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 24px;
    }

    .logo {
      font-size: 20px;
      font-weight: bold;
    }

    nav {
      display: flex;
      gap: 18px;
      align-items: center;
    }

    nav a {
      color: #333;
      text-decoration: none;
    }

    .hero {
      background: white;
      text-align: center;
      padding: 70px 20px;
    }

    .hero h1 {
      font-size: 36px;
      margin-bottom: 12px;
    }

    .hero p {
      color: #666;
      margin-bottom: 30px;
    }

    .search {
      max-width: 600px;
      margin: auto;
      display: flex;
      gap: 8px;
    }

    .search input {
      flex: 1;
      padding: 14px;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 16px;
    }

    button {
      border: none;
      background: #222;
      color: white;
      padding: 14px 22px;
      border-radius: 8px;
      font-size: 16px;
    }

    .section {
      max-width: 1000px;
      margin: 40px auto;
      padding: 0 20px;
    }

    .categories {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
    }

    .category {
      background: white;
      padding: 18px 24px;
      border-radius: 10px;
      border: 1px solid #ddd;
    }

    .actions {
      display: flex;
      gap: 16px;
      flex-wrap: wrap;
    }

    .action {
      flex: 1;
      min-width: 200px;
      background: white;
      padding: 25px;
      border-radius: 12px;
      border: 1px solid #ddd;
    }

    .action h3 {
      margin-top: 0;
    }
  </style>
</head>

<body>

  <header>
    <div class="logo">委託平台</div>

    <nav>
      <a href="#">找委託</a>
      <a href="#">找創作者</a>
      <a href="#">登入</a>
    </nav>
  </header>

  <section class="hero">
    <h1>找到你需要的服務</h1>
    <p>連結委託人與創作者的委託平台</p>

    <div class="search">
      <input type="text" placeholder="搜尋作品、服務或創作者">
      <button>搜尋</button>
    </div>
  </section>

  <section class="section">
    <h2>熱門分類</h2>

    <div class="categories">
      <div class="category">🎨 插畫</div>
      <div class="category">✏️ 設計</div>
      <div class="category">🎙️ 配音</div>
      <div class="category">🎬 剪輯</div>
      <div class="category">✍️ 寫作</div>
      <div class="category">＋ 更多</div>
    </div>
  </section>

  <section class="section">
    <h2>你想做什麼？</h2>

    <div class="actions">
      <div class="action">
        <h3>我要發布委託</h3>
        <p>提出需求，尋找適合的創作者。</p>
        <button>發布委託</button>
      </div>

      <div class="action">
        <h3>我要接委託</h3>
        <p>展示你的服務，尋找委託人。</p>
        <button>成為創作者</button>
      </div>
    </div>
  </section>

</body>
</html>
