<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>委託平台</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, "Noto Sans TC", sans-serif;
      color: #222;
      background: #fff;
    }

    header {
      height: 60px;
      border-bottom: 1px solid #ddd;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 20px;
    }

    .logo {
      font-size: 18px;
      font-weight: bold;
    }

    nav a {
      margin-left: 18px;
      color: #333;
      text-decoration: none;
      font-size: 14px;
    }

    main {
      max-width: 1000px;
      margin: 0 auto;
      padding: 35px 20px;
    }

    .search {
      display: flex;
      gap: 8px;
      margin-bottom: 35px;
    }

    .search input {
      flex: 1;
      height: 42px;
      padding: 0 12px;
      border: 1px solid #bbb;
      font-size: 14px;
    }

    button {
      height: 42px;
      padding: 0 20px;
      border: 1px solid #222;
      background: #222;
      color: white;
      cursor: pointer;
    }

    h2 {
      font-size: 20px;
      margin: 30px 0 15px;
    }

    .categories {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    .category {
      border: 1px solid #ddd;
      padding: 10px 18px;
      cursor: pointer;
    }

    .list {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 15px;
    }

    .item {
      border: 1px solid #ddd;
      padding: 18px;
      min-height: 130px;
      text-decoration: none;
      color: #222;
      display: block;
    }

    .item:hover,
    .category:hover {
      background: #f7f7f7;
    }

    .item h3 {
      margin: 0 0 10px;
      font-size: 16px;
    }

    .item p {
      margin: 5px 0;
      color: #666;
      font-size: 14px;
    }

    @media (max-width: 700px) {
      .list {
        grid-template-columns: 1fr;
      }

      nav a {
        margin-left: 8px;
      }
    }
  </style>
</head>

<body>

<header>
  <div class="logo">委託平台</div>

  <nav>
    <a href="index.html">首頁</a>
    <a href="commissions.html">找委託</a>
    <a href="post.html">發布委託</a>
    <a href="creators.html">找創作者</a>
    <a href="index.html">登入</a>
  </nav>
</header>

<main>

  <div class="search">
    <input type="text" placeholder="搜尋委託、服務或創作者">
    <button>搜尋</button>
  </div>

  <h2>分類</h2>

  <div class="categories">
    <a class="category" href="commissions.html">插畫</a>
    <a class="category" href="commissions.html">設計</a>
    <a class="category" href="commissions.html">寫作</a>
    <a class="category" href="commissions.html">配音</a>
    <a class="category" href="commissions.html">影片</a>
    <a class="category" href="commissions.html">其他</a>
  </div>

  <h2>最新委託</h2>

  <div class="list">

    <a class="item" href="commission.html">
      <h3>角色立繪</h3>
      <p>委託人：使用者 A</p>
      <p>預算：NT$1,000</p>
    </a>

    <a class="item" href="commission.html">
      <h3>Logo 設計</h3>
      <p>委託人：使用者 B</p>
      <p>預算：NT$2,000</p>
    </a>

    <a class="item" href="commission.html">
      <h3>影片剪輯</h3>
      <p>委託人：使用者 C</p>
      <p>預算：NT$1,500</p>
    </a>

  </div>

</main>

</body>
</html>
