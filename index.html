<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>委託平台</title>

  <style>
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Noto Sans TC", sans-serif;
      background: #f7f7f7;
      color: #222;
    }

    header {
      background: white;
      padding: 20px;
      text-align: center;
      border-bottom: 1px solid #ddd;
    }

    main {
      max-width: 900px;
      margin: 40px auto;
      padding: 20px;
    }

    .hero {
      background: white;
      padding: 50px 20px;
      text-align: center;
      border-radius: 16px;
    }

    button {
      background: #222;
      color: white;
      border: none;
      padding: 12px 24px;
      border-radius: 8px;
      font-size: 16px;
    }
  </style>
</head>

<body>

  <header>
    <h2>我的委託平台</h2>
  </header>

  <main>
    <section class="hero">
      <h1>歡迎來到委託平台</h1>
      <p>在這裡查看作品、了解委託內容並提出委託。</p>

      <button>開始委託</button>
    </section>
  </main>

</body>
</html>
